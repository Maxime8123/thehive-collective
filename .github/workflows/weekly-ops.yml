name: Weekly ops (Sun)
on:
  schedule:
    - cron: '37 7 * * 0'   # Sun 07:37 UTC
  workflow_dispatch:

jobs:
  ops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: HF Dataset + Space refresh
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cron/hf-refresh.mjs || true
      - name: Append log
        run: |
          git config user.name "thehive-autorun"
          git config user.email "bot@thehivecollective.io"
          git add AUTONOMOUS-LOG.md || true
          git diff --cached --quiet || git commit -m "log: weekly ops $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || sleep $((i * 3))
          done || true
